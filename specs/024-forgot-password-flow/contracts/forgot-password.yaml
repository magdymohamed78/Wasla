# POST /api/Auth/forgot-password

**Tag**: 01 - Authentication & Onboarding  
**Summary**: Request a one-time password (OTP) to reset a forgotten password.  
**Description**: Always returns 200 OK to prevent email enumeration. If the email exists, a 6-digit OTP valid for 10 minutes is sent.  
**Rate limit**: 5 requests per 60 seconds per IP.

## Request

**Content-Type**: `application/json`

### Schema: ForgotPasswordDto

```yaml
ForgotPasswordDto:
  required:
    - email
  type: object
  properties:
    email:
      minLength: 1
      type: string
      format: email
  additionalProperties: false
```

### Example Request Body

```json
{
  "email": "user@example.com"
}
```

## Responses

### 200 OK

**Description**: Request processed (OTP sent if email is registered).  
**Body**: Empty (no response body).

### 429 Too Many Requests

**Description**: Too many requests.  
**Content-Type**: `application/json`

```yaml
ProblemDetails:
  type: object
  properties:
    type:
      type: string
      nullable: true
    title:
      type: string
      nullable: true
    status:
      type: integer
      format: int32
      nullable: true
    detail:
      type: string
      nullable: true
    instance:
      type: string
      nullable: true
  additionalProperties: {}
```

### Example 429 Response

```json
{
  "type": "https://tools.ietf.org/html/rfc6585#section-4",
  "title": "Too Many Requests",
  "status": 429,
  "detail": "Rate limit exceeded. Try again later."
}
```

## Client Behavior

1. Validate email client-side (non-empty, email format) before calling.
2. Show loading indicator on Send button during request.
3. On **200**: Navigate to OTP Verification screen, passing email.
4. On **429**: Display "Too many requests" error message.
5. On **network error**: Display user-friendly error message.
