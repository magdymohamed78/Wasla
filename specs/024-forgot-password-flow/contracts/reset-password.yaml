# POST /api/Auth/reset-password

**Tag**: 01 - Authentication & Onboarding  
**Summary**: Reset a forgotten password using the OTP received by email.  
**Description**: The OTP is valid for 10 minutes and can be used only once. After 5 incorrect attempts the OTP is permanently invalidated.  
**Rate limit**: 5 requests per 60 seconds per IP.

## Request

**Content-Type**: `application/json`

### Schema: ResetPasswordDto

```yaml
ResetPasswordDto:
  required:
    - email
    - otp
    - newPassword
    - confirmNewPassword
  type: object
  properties:
    email:
      minLength: 1
      type: string
      format: email
    otp:
      minLength: 6
      maxLength: 6
      type: string
    newPassword:
      minLength: 6
      type: string
    confirmNewPassword:
      minLength: 1
      type: string
  additionalProperties: false
```

### Example Request Body

```json
{
  "email": "user@example.com",
  "otp": "123456",
  "newPassword": "NewP@ss123",
  "confirmNewPassword": "NewP@ss123"
}
```

## Responses

### 200 OK

**Description**: Password reset successfully.  
**Body**: Empty (no response body).

### 400 Bad Request

**Description**: Invalid OTP, expired OTP, or password policy violation.  
**Content-Type**: `application/json`

```yaml
ProblemDetails:
  type: object
  properties:
    type:
      type: string
      nullable: true
    title:
      type: string
      nullable: true
    status:
      type: integer
      format: int32
      nullable: true
    detail:
      type: string
      nullable: true
    instance:
      type: string
      nullable: true
  additionalProperties: {}
```

### Example 400 Responses

**Expired/Invalid OTP**:
```json
{
  "type": "https://tools.ietf.org/html/rfc7231#section-6.5.1",
  "title": "Bad Request",
  "status": 400,
  "detail": "Invalid or expired OTP."
}
```

**Password Policy Violation**:
```json
{
  "type": "https://tools.ietf.org/html/rfc7231#section-6.5.1",
  "title": "Bad Request",
  "status": 400,
  "detail": "Password does not meet the minimum requirements."
}
```

### 429 Too Many Requests

**Description**: Too many requests.  
**Content-Type**: `application/json`  
Same `ProblemDetails` schema as above.

## Client Behavior

1. Validate client-side: newPassword >= 6 chars, confirmNewPassword matches newPassword.
2. Show loading indicator on Confirm button during request.
3. On **200**: Show success toast "Password reset successfully", then navigate to Login (replace stack).
4. On **400 (expired/invalid OTP)**: Show error message on screen, then auto-navigate back to Forgot Password screen after ~2-3 seconds.
5. On **400 (password policy)**: Show inline validation error, stay on Change Password screen.
6. On **429**: Display "Too many requests" error message.
7. On **network error**: Display user-friendly error message.

### Distinguishing 400 Error Types

The client must inspect the `detail` field of the `ProblemDetails` response:
- If `detail` contains "OTP" or "otp" or "expired" or "invalid" → treat as expired/invalid OTP → auto-navigate back
- Otherwise → treat as password policy violation → show inline error
